name: Build Lumina APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "LUMINA AI" com.luminastudio.ai --web-dir=dist
      - name: Build Web
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
      - name: Add Android
        run: |
          npx cap add android
          npx cap copy android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
